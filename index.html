<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>米諾斯迷宮・線結手繩</title>
<style>
:root{color-scheme:dark;--bg:#0b0a08;--bg2:#15110d;--bg3:#201a13;--line:#3a2f24;--tx:#e4d8c0;--mut:#8d8168;--amb:#e0b95a;--red:#c8503a;--grn:#7fbf7a;--teal:#6cc2c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
#top{padding:7px 12px;background:linear-gradient(180deg,#1a140e,#0d0a07);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#top b{color:var(--amb);letter-spacing:.12em;white-space:nowrap}
.chips{flex:1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:1px 8px;white-space:nowrap}
.chip.hp{color:var(--grn)}.chip.pt{color:var(--amb)}.chip.lo{color:var(--teal)}.chip.bad{color:var(--red)}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 2px;color:var(--mut);font-size:14px}
#tabs button.on{color:var(--amb);border-bottom-color:var(--amb)}
#tabs button.dot::after{content:"●";color:var(--red);font-size:9px;vertical-align:top;margin-left:2px}
#view{flex:1;overflow:auto;padding:10px 12px 36px}
#sbar:empty{display:none}#sbar{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg2)}
h3{margin:12px 0 7px;font-size:15px;color:var(--amb);font-weight:600}h3:first-child{margin-top:2px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:3px 0}.row span:first-child{color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.btn{background:#1f1913;border:1px solid #4a3b2c;border-radius:8px;padding:8px 12px;min-height:40px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{background:#4a3b2c}.btn:disabled{opacity:.38;cursor:default}
.btn.amb{background:#3a2f12;border-color:#8a7232;color:#ffe3a0}.btn.red{background:#3a1c18;border-color:#8a4a40;color:#ffc0b5}
.btn.wide{width:100%;margin-top:6px}.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
input,textarea,select{width:100%;background:#0c0a07;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.bar{height:6px;background:#2a1a14;border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--grn)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--mut);margin-left:4px}
.tag.ok{color:var(--grn);border-color:#3e6a46}.tag.bad{color:var(--red);border-color:#7a3d35}.tag.fix{color:var(--amb);border-color:#7a6430}
.shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.shop-item:first-child{border-top:0}
.shop-item .nm{flex:1}.shop-item .nm small{display:block;color:var(--mut);font-size:12px}.price{color:var(--amb);white-space:nowrap;font-size:13px;margin-right:4px}
.log{font-size:13px;color:var(--mut);border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
.ally{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.ally:first-child{border-top:0}
.av{width:42px;height:42px;border-radius:50%;flex:none;background:#2a2118 center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:1px solid #5a4a38;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
/* story */
.s-pic{margin:0 0 10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:200px}.s-pic img{display:block;width:100%;height:200px;object-fit:cover;object-position:50% 35%}
.s-st{font-size:12px;color:#a89878;letter-spacing:.04em;margin:2px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.s-p{color:#cfc4ad;margin:0 0 .75em;line-height:1.8}
.s-d{color:#f4dfa0;margin:0 0 .75em;padding:2px 0 2px 10px;border-left:3px solid #b99a4a;background:rgba(224,185,90,.06);line-height:1.8}.s-d b{color:#ffe9b0}
.s-hr{height:1px;background:var(--line);margin:12px 0}
.s-opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}.s-opts .btn{text-align:left}
.s-col{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}.s-col summary{padding:6px 10px;color:var(--mut);cursor:pointer;font-size:13px}.s-col div{padding:0 10px 8px;font-size:13px;color:#a89c84;white-space:pre-wrap}
.s-busy{color:var(--amb);font-size:13px;margin:6px 0}.s-ev{font-size:13px;color:var(--teal);border:1px solid #2a4a52;background:rgba(108,194,192,.07);border-radius:8px;padding:5px 10px;margin:6px 0}
.s-res{white-space:pre-wrap;font-size:13px;color:#a89c84}
.s-bar{display:flex;gap:8px;align-items:flex-end}.s-bar textarea{flex:1;min-height:56px;max-height:140px;resize:none}.s-bar .btn{min-height:56px;min-width:64px}
.locs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.locs .btn{min-height:34px;padding:4px 10px;font-size:13px}.locs .btn.cur{border-color:var(--amb);color:var(--amb)}
/* dungeon */
.vw{position:relative}
#dv{width:100%;aspect-ratio:8/5;display:block;background:#000;border:2px solid var(--line);border-radius:6px;image-rendering:pixelated}
#en{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:6px;pointer-events:none}
.ec{pointer-events:auto;width:128px;background:rgba(10,8,6,.72);border:1px solid var(--line);border-radius:8px;padding:4px;text-align:center;font-size:12px}.ec.boss{width:190px}
.ec.sel{border-color:var(--amb);box-shadow:0 0 0 2px rgba(224,185,90,.5);cursor:pointer}.ec.dead{opacity:.25;filter:grayscale(1)}
.ec img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.ec img.px{image-rendering:pixelated}
.hb{height:5px;background:#3a1a16;border-radius:3px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--red)}.pc .hb i{background:var(--grn)}
.drow{display:flex;gap:8px;margin-top:8px;align-items:stretch}
#party{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.pc{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px}.pc b{font-weight:600;display:block}.pc small{color:var(--mut)}.pc.down{opacity:.45}.pc.def{border-color:var(--teal)}
#dm{width:132px;height:132px;background:#000;border:2px solid var(--line);border-radius:6px;image-rendering:pixelated;flex:none}
#dstat{margin:8px 0 0;font-size:13px;color:#b9ad92;display:flex;gap:12px;flex-wrap:wrap}#dstat .warn{color:var(--red)}
.pad,.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pad .btn,.cmd .btn{font-size:15px;padding:12px 6px}.pad .wide,.cmd .wide{grid-column:1/4;margin-top:0}
#dlog{margin-top:8px;background:#100d0a;border:1px solid #2e251c;border-radius:6px;padding:7px 10px;font-size:13px;line-height:1.6;min-height:7em;max-height:11em;overflow:auto}
#dlog div{color:var(--mut)}#dlog div:first-child{color:#f0e3c4}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a2218;border:1px solid #6a5838;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;z-index:50}#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:40}#modal.on{display:flex}
#mbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:480px;width:100%;max-height:88vh;overflow:auto}
#mbox h3,#mbox h4{margin:0 0 8px;color:var(--amb)}#mbox .btn{display:block;width:100%;margin-top:6px;text-align:left;padding:10px 12px}#mbox .mut{margin:4px 0}
.dead{color:var(--red);font-weight:700}
</style>
</head>

var G;
function fresh(){return{v:1,started:false,name:'',lv:1,xp:0,hp:100,sp:3,pts:60,oil:12,items:{potion:2,fire:1,water:0,thread:0},keys:0,pages:[],ua:0,ud:0,ending:null,nt:0,loc:'port',in:false,f:1,x:1,y:1,turn:0,seen:{},taken:{},slain:{},opened:{},guard:{},bound:[],steps:0,
 roster:[],party:[],notes:[],processed:[],battle:null,run:null,dead:false,idle:0,auto:true,test:false,tourDone:false,cleared:false}}
function load(){try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);if(o&&o.v===1)return o}}catch(e){}return null}
G=load()||fresh();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}arm()}
function mhp(){return 100+15*(G.lv-1)}
function pdmg(){return Math.round((12+3*(G.lv-1)+3*(G.ua|0))*(G.oil<=0&&G.in?0.8:1))}
function parmor(){return 2+(G.ud|0)}
function allyMax(a){return ALLY[a.style].hp+8*(G.lv-1)}
function allyDmg(a){return ALLY[a.style].dmg+2*(G.lv-1)+3*(a.ua|0)}
function allyArmor(a){return 3+(a.ud|0)}
function person(n){return G.roster.find(function(r){return r.name===n})}
function partyList(){return G.party.map(person).filter(Boolean)}
function note(t){G.notes.push(t);if(G.notes.length>8)G.notes.shift()}
function newRun(){return{kills:{},pts:0,xp:0,items:{},pages:[],boss:[],downs:{},lost:[],deep:1,steps0:G.steps,lv0:G.lv,rests:0,bound:[]}}

var FD={},CUR=null,BT=null,DL=[],DX=[0,1,0,-1],DY=[-1,0,1,0],DGMODE=null;
function fd(f){return FD[f]||(FD[f]=genFloor(f))}
function makeCur(f){var d=fd(f),g=d.grid.map(function(r){return r.slice()});
 for(var y=0;y<g.length;y++)for(var x=0;x<g.length;x++)if(g[y][x]==='D'&&G.opened[f+':'+x+','+y])g[y][x]='.';
 if(!FL[f].boss||G.guard[f])g[d.boss.y][d.boss.x]='>';return g}
function say(s){DL.unshift(s);if(DL.length>40)DL.length=40;upd()}
function feAlive(f,ft){var k=f+':'+ft.id;if(ft.type==='mon')return !G.slain[k];if(ft.type==='boss')return !G.guard[f];return !G.taken[k]}
function featAt(x,y,types){return fd(G.f).feats.find(function(ft){return ft.x===x&&ft.y===y&&feAlive(G.f,ft)&&(!types||types.indexOf(ft.type)>=0)})}
function isDark(){return G.in&&G.oil<=0}
var turn=0,px=1.5,py=1.5,ang=0,tx=1.5,ty=1.5,tang=0,flash=0;
function snapView(){px=tx=G.x+.5;py=ty=G.y+.5;turn=G.turn;ang=tang=-Math.PI/2+turn*Math.PI/2}
function reveal(){var k=G.f,s=G.seen[k]||(G.seen[k]={});for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++)s[(G.x+dx)+','+(G.y+dy)]=1}
function enterFloor(f,mode){G.f=f;CUR=makeCur(f);var d=fd(f);if(mode==='up'){G.x=d.boss.x;G.y=d.boss.y}else{G.x=1;G.y=1}
 var best=0;for(var k=0;k<4;k++){if(CUR[G.y+DY[k]]&&CUR[G.y+DY[k]][G.x+DX[k]]!=='#'){best=k;break}}
 G.turn=best;snapView();reveal();if(G.in&&G.run&&f>G.run.deep)G.run.deep=f;persist();upd()}
function dir(){return((turn%4)+4)%4}
function moving(){return Math.abs(tx-px)>.05||Math.abs(ty-py)>.05||Math.abs(tang-ang)>.05}
function tryMove(dx,dy){var nx=G.x+dx,ny=G.y+dy,c=CUR[ny]&&CUR[ny][nx];
 if(!c||c==='#'){say('前面是冰冷的石牆。');return}
 if(c==='D'){if(G.keys>0){G.keys--;G.opened[G.f+':'+nx+','+ny]=1;CUR[ny][nx]='.';say('青銅鑰匙轉動，門開了。')}else say('門鎖住了，需要一把青銅鑰匙。');persist();upd();return}
 var m=featAt(nx,ny,['mon','boss']);if(m){if(m.type==='boss'&&G.f===FL.length-1&&G.pages.length>=5&&!G.ending){PB=m;namePrompt('');return}startBattle({type:m.type,id:m.id,foes:m.foes,ctx:'dg'});return}
 G.x=nx;G.y=ny;tx=G.x+.5;ty=G.y+.5;G.steps++;reveal();
 if(G.steps%24===0&&G.oil>0){G.oil--;if(G.oil===0)say('燈油用盡，四周陷入黑暗。')}
 if(CUR[G.y][G.x]==='>'&&!G.guard[G.f]&&!FL[G.f].boss)bindFloor();
 var it=featAt(G.x,G.y,['key','chest','page']);if(it){G.taken[G.f+':'+it.id]=1;pickup(it)}
 persist();upd()}
function loot(good){var f=G.f,o=[],n=good?2:1;
 for(var i=0;i<n;i++){var r=Math.random();
  if(r<0.5||(good&&i===0)){var v=ri(25,55)*f*(good?2:1);G.pts+=v;R().pts+=v;o.push(v+' 銀幣')}
  else if(r<0.78){G.items.potion++;addItem('potion');o.push('橄欖藥酒')}
  else if(r<0.92){G.items.fire++;addItem('fire');o.push('火油瓶')}
  else{G.oil=Math.min(30,G.oil+6);addItem('oil',6);o.push('燈油 +6')}}
 return o.join('、')}
function pickup(it){
 if(it.type==='key'){G.keys++;say('撿到一把青銅鑰匙。')}
 else if(it.type==='chest'){say('打開寶箱，得到：'+loot(it.good))}
 else if(it.type==='page'){G.pages.push(it.n);R().pages.push(it.n);say('📜 '+PAGES[it.n-1]);if(G.pages.length>=5)say('五頁手稿拼在一起了。最後一行字下面，有一個被劃掉很多次的名字，看得出是三個字。')}}
function nearMon(){return fd(G.f).feats.some(function(ft){return(ft.type==='mon'||ft.type==='boss')&&feAlive(G.f,ft)&&Math.max(Math.abs(ft.x-G.x),Math.abs(ft.y-G.y))<=3})}
function act(a){if(!G.in||G.dead||BT||moving())return;var d=dir();
 switch(a){case'fwd':tryMove(DX[d],DY[d]);break;case'back':tryMove(-DX[d],-DY[d]);break;
 case'sl':tryMove(DX[(d+3)%4],DY[(d+3)%4]);break;case'sr':tryMove(DX[(d+1)%4],DY[(d+1)%4]);break;
 case'tl':G.turn--;turn=G.turn;tang=-Math.PI/2+turn*Math.PI/2;break;case'tr':G.turn++;turn=G.turn;tang=-Math.PI/2+turn*Math.PI/2;break}}
function onSpring(){return G.x===1&&G.y===1}
function onStairs(){return CUR&&CUR[G.y]&&CUR[G.y][G.x]==='>'}

 L.push('路線：第'+(r.from||1)+'層→最深到第'+r.deep+'層｜走了 '+(G.steps-r.steps0)+' 步｜泉邊休整 '+r.rests+' 次');

 BT={cfg:c,party:party,foes:foes,round:1,mode:'cmd',pending:null,log:['戰鬥開始！'],over:null};

 switch(t){

function parseLoose(txt){txt=String(txt||'').trim().replace(/^```\s*minos\s*/i,'').replace(/```\s*$/,'').trim();
 try{return JSON.parse(txt)}catch(e){}try{return JSON.parse(txt.replace(/,\s*([}\]])/g,'$1').replace(/[“”]/g,'"'))}catch(e){}

function ingest(text){if(!G.started)return{status:'nosave',msg:'手繩尚未啟用'};
 var h=djb(String(text))+':'+String(text).length;if(G.processed.indexOf(h)>=0)return{status:'done',msg:'已處理過'};
 var o=parseLoose(text);if(!o)return{status:'error',msg:'看不懂這段資料'};
 var evs=Array.isArray(o)?o:(o.events||(o.type?[o]:[]));var done=[],bad=[];
 evs.forEach(function(ev){try{var r=apply(ev);if(r)done.push(r)}catch(x){bad.push(String(x.message||x))}});
 G.processed.push(h);if(G.processed.length>200)G.processed.shift();persist();render();
 var msg=done.join('；')+(bad.length?'（略過：'+bad.join('、')+'）':'');if(msg)toast('手繩更新：'+msg);return{status:'done',msg:msg}}
